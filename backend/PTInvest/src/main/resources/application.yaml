spring:
  application:
    name: PTInvest

  datasource:
    url: jdbc:postgresql://localhost:5432/ptinvest
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
